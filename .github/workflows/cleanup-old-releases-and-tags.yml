name: Cleanup old releases and tags

on:
  push:
    paths:
      - .github/workflows/cleanup-old-releases-and-tags.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the newest release and its tag
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );

            if (releases.length === 0) {
              core.setFailed('No releases found. No tags were deleted.');
              return;
            }

            releases.sort((a, b) =>
              new Date(b.published_at ?? b.created_at) - new Date(a.published_at ?? a.created_at)
            );

            const keep = releases[0];
            core.info(`Keeping release ${keep.name ?? keep.tag_name} (${keep.tag_name})`);

            for (const release of releases.slice(1)) {
              core.info(`Deleting release ${release.name ?? release.tag_name} (${release.id})`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
            }

            const tags = await github.paginate(
              github.rest.repos.listTags,
              { owner, repo, per_page: 100 }
            );

            for (const tag of tags) {
              if (tag.name === keep.tag_name) continue;
              core.info(`Deleting tag ${tag.name}`);
              await github.rest.git.deleteRef({
                owner,
                repo,
                ref: `tags/${tag.name}`
              });
            }

            core.notice(`Cleanup complete. Kept release and tag: ${keep.tag_name}`);

      - name: Remove temporary workflow
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '.github/workflows/cleanup-old-releases-and-tags.yml';
            const branch = context.ref.replace('refs/heads/', '');
            const file = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path,
              branch,
              sha: file.data.sha,
              message: 'chore: remove temporary release cleanup workflow'
            });
