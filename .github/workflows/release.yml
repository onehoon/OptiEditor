name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - id: version
        shell: pwsh
        run: |
          $latest = git tag -l 'v0.1.*' --sort=-version:refname | Select-Object -First 1
          $patch = if ($latest -match '^v0\.1\.(\d+)$') { [int]$Matches[1] + 1 } else { 0 }
          $version = "0.1.$patch"
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: dotnet tool restore
      - run: dotnet restore OptiEditor.sln
      - run: dotnet test tests/OptiEditor.Core.Tests/OptiEditor.Core.Tests.csproj --configuration Release
      - name: Download previous Velopack release for delta generation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hasPreviousRelease = gh api "repos/${{ github.repository }}/releases?per_page=1" --jq 'length' 2>$null
          if ([int]$hasPreviousRelease -gt 0) {
            dotnet vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}"
            if ($LASTEXITCODE -ne 0) { throw "Previous Velopack release download failed." }
          } else { Write-Host "No prior GitHub Release exists; the first release will contain only a full package." }
      - run: dotnet publish src/OptiEditor.App/OptiEditor.App.csproj -c Release -r win-x64 --self-contained true -o publish /p:Version=${{ steps.version.outputs.version }}
      - run: dotnet vpk pack --packId OptiEditor --packVersion ${{ steps.version.outputs.version }} --packDir publish --mainExe OptiEditor.exe --packTitle OptiEditor --packAuthors onehoon --runtime win10.0.17763-x64
      - run: dotnet vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --publish --releaseName "OptiEditor ${{ steps.version.outputs.version }}" --tag "v${{ steps.version.outputs.version }}"
      - name: Prepend the game-closing caution to the release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $current = gh release view $tag --repo "${{ github.repository }}" --json body --jq .body
          # Backtick is PowerShell's escape character, so a literal backtick
          # (for the `OptiScaler.ini` code span) cannot be written directly
          # inside the string -- build it from a single-quoted, non-
          # interpolating literal instead.
          $tick = '`'
          $caution = "> [!CAUTION]`n> **Close all games before editing an ${tick}OptiScaler.ini${tick} file or replacing an OptiScaler DLL with OptiEditor.** Editing settings or updating binaries while a game is running can corrupt the installation or crash the game."
          $notes = if ([string]::IsNullOrWhiteSpace($current)) { $caution } else { "$caution`n`n$current" }
          gh release edit $tag --repo "${{ github.repository }}" --notes $notes
      - name: Keep the latest two releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh release list --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          $managed = $releases |
            Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -match '^v0\.1\.\d+$' } |
            Sort-Object { [version]$_.tagName.TrimStart('v') } -Descending
          $obsolete = $managed | Select-Object -Skip 2

          foreach ($release in $obsolete) {
            Write-Host "Deleting obsolete release and tag: $($release.tagName)"
            gh release delete $release.tagName --yes
            if ($LASTEXITCODE -ne 0) { throw "Release deletion failed: $($release.tagName)" }
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$($release.tagName)"
            if ($LASTEXITCODE -ne 0) { throw "Tag deletion failed: $($release.tagName)" }
          }
