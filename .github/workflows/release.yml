name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - id: version
        shell: pwsh
        run: |
          $latest = git tag -l 'v0.1.*' --sort=-version:refname | Select-Object -First 1
          $patch = if ($latest -match '^v0\.1\.(\d+)$') { [int]$Matches[1] + 1 } else { 0 }
          $version = "0.1.$patch"
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: dotnet tool restore
      - run: dotnet restore OptiEditor.sln
      - run: dotnet test tests/OptiEditor.Core.Tests/OptiEditor.Core.Tests.csproj --configuration Release
      - name: Download previous Velopack release for delta generation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hasPreviousRelease = gh api "repos/${{ github.repository }}/releases?per_page=1" --jq 'length' 2>$null
          if ([int]$hasPreviousRelease -gt 0) {
            dotnet vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}"
            if ($LASTEXITCODE -ne 0) { throw "Previous Velopack release download failed." }
          } else { Write-Host "No prior GitHub Release exists; the first release will contain only a full package." }
      - run: dotnet publish src/OptiEditor.App/OptiEditor.App.csproj -c Release -r win-x64 --self-contained false -o publish /p:Version=${{ steps.version.outputs.version }}
      - run: dotnet vpk pack --packId OptiEditor --packVersion ${{ steps.version.outputs.version }} --packDir publish --mainExe OptiEditor.exe --packTitle OptiEditor --packAuthors onehoon --runtime win10.0.17763-x64 --framework net10-x64-desktop
      - run: dotnet vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --publish --releaseName "OptiEditor ${{ steps.version.outputs.version }}" --tag "v${{ steps.version.outputs.version }}"
