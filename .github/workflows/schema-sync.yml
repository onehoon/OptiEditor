name: Check OptiScaler Schema

on:
  schedule:
    # 08:00 Asia/Seoul (23:00 UTC on the previous day)
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: optiscaler-schema-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve upstream commits once for both generations
        shell: pwsh
        run: |
          # Resolve release/0.9 and master to commit SHAs exactly once here,
          # then pin both regeneration runs below to those SHAs. Previously
          # each run independently re-resolved the live branch tip, so an
          # upstream push landing between the two runs made the "did the
          # generator produce different output for the same input"
          # non-determinism check actually compare two DIFFERENT inputs and
          # misreport a real (if oddly timed) upstream change as a generator
          # bug.
          function Resolve-Commit([string] $Ref) {
            $result = git ls-remote "https://github.com/optiscaler/OptiScaler.git" "refs/heads/$Ref"
            $match = $result | Select-Object -First 1
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($match)) { throw "Unable to resolve upstream branch '$Ref'." }
            return ($match -split "\s+")[0]
          }
          "V09_SHA=$(Resolve-Commit 'release/0.9')" >> $env:GITHUB_ENV
          "V10_SHA=$(Resolve-Commit 'master')" >> $env:GITHUB_ENV
      - name: Check whether upstream root INI files changed
        shell: pwsh
        run: |
          $catalogPath = 'src/OptiEditor.Core/Schema/GeneratedOptiScalerSchemaCatalog.cs'
          $catalog = Get-Content -Raw $catalogPath
          $source = [regex]::Match(
            $catalog,
            '// Source: optiscaler/OptiScaler \(release/0\.9 @ (?<v09>[0-9a-f]{40}); master @ (?<v10>[0-9a-f]{40})\)'
          )
          if (-not $source.Success) {
            throw "Could not read the previously synchronized OptiScaler commits from $catalogPath."
          }

          function Get-IniHash([string] $Commit, [string] $Name) {
            $path = Join-Path $env:RUNNER_TEMP "optiscaler-$Name.ini"
            Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/optiscaler/OptiScaler/$Commit/OptiScaler.ini" -OutFile $path
            return (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
          }

          $v09Changed = (Get-IniHash $source.Groups['v09'].Value 'previous-v09') -ne (Get-IniHash $env:V09_SHA 'current-v09')
          $v10Changed = (Get-IniHash $source.Groups['v10'].Value 'previous-v10') -ne (Get-IniHash $env:V10_SHA 'current-v10')
          "V09_INI_CHANGED=$($v09Changed.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          "V10_INI_CHANGED=$($v10Changed.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          if (-not $v09Changed -and -not $v10Changed) {
            Write-Host 'Upstream root OptiScaler.ini files are unchanged.'
          }
      - name: Regenerate schema from upstream source
        if: env.V09_INI_CHANGED == 'true' || env.V10_INI_CHANGED == 'true'
        shell: pwsh
        # V09Ref/V10Ref stay as branch names -- they're only used for the
        # generated header's display text -- while V09Commit/V10Commit pin
        # the actual fetch to the SHAs resolved above. Passing the resolved
        # SHA as V09Ref/V10Ref instead would change the header text itself
        # (branch name -> SHA) even when nothing upstream changed, which
        # would make git status see a diff and false-trigger an issue on
        # every run.
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\Sync-OptiScalerSchema.ps1 -V09Commit $env:V09_SHA -V10Commit $env:V10_SHA
      - name: Regenerate a second time to rule out run-to-run non-determinism
        if: env.V09_INI_CHANGED == 'true' || env.V10_INI_CHANGED == 'true'
        shell: pwsh
        run: |
          Copy-Item src/OptiEditor.Core/Schema/GeneratedOptiScalerSchemaCatalog.cs "$env:RUNNER_TEMP/first-generation.cs"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\Sync-OptiScalerSchema.ps1 -V09Commit $env:V09_SHA -V10Commit $env:V10_SHA
          $rerunDiff = Compare-Object (Get-Content "$env:RUNNER_TEMP/first-generation.cs") (Get-Content src/OptiEditor.Core/Schema/GeneratedOptiScalerSchemaCatalog.cs)
          "IS_NONDETERMINISTIC=$(if ($rerunDiff) { 'true' } else { 'false' })" >> $env:GITHUB_ENV
      - name: Open or update an issue when upstream root INI changed
        if: env.V09_INI_CHANGED == 'true' || env.V10_INI_CHANGED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $changed = git status --porcelain -- src/OptiEditor.Core/Schema/GeneratedOptiScalerSchemaCatalog.cs
          if (-not $changed) {
            Write-Host "Upstream schema is unchanged."
            exit 0
          }

          # Capture what actually changed instead of only detecting that
          # something did: past reports gave no evidence to diagnose whether a
          # detected change was a real upstream edit or a generator bug, which
          # made repeat flapping (see #17, #20) impossible to root-cause from
          # the issue alone.
          $diffLines = git diff -- src/OptiEditor.Core/Schema/GeneratedOptiScalerSchemaCatalog.cs
          $diff = ($diffLines | Select-Object -First 400) -join "`n"
          if ($diffLines.Count -gt 400) { $diff += "`n... (truncated; $($diffLines.Count) lines total)" }

          # Backticks are PowerShell's escape character, so they cannot appear
          # literally inside a double-quoted here-string (the previous version
          # of this script had exactly that bug: `` `release/0.9` `` was parsed
          # as the `` `r `` carriage-return escape followed by unescaped text,
          # silently mangling every posted issue body). Build every backtick
          # from a single-quoted, non-interpolating literal instead.
          $tick = '`'
          $fence = '```'

          $nonDeterminismWarning = ""
          if ($env:IS_NONDETERMINISTIC -eq 'true') {
            $nonDeterminismWarning = "`n**Warning:** regenerating a second time in this same run, against the same checked-out commit, produced a *different* result than the first generation. This points at non-determinism in ${tick}tools/Sync-OptiScalerSchema.ps1${tick} itself (or a transient fetch problem), not necessarily a genuine upstream change -- investigate before trusting the diff below.`n"
          }

          $title = "[Schema Sync] OptiScaler upstream OptiScaler.ini changed"
          $body = @"
          The daily schema check detected a change in the root ${tick}OptiScaler.ini${tick} on OptiScaler's ${tick}release/0.9${tick} or ${tick}master${tick} branch.
          $nonDeterminismWarning
          Review the generated diff, validate it locally, then commit the refreshed catalog deliberately. Release CI does not automatically consume upstream changes.

          <details><summary>Diff against the committed catalog</summary>

          ${fence}diff
          $diff
          ${fence}
          </details>
          "@
          $bodyPath = Join-Path $env:RUNNER_TEMP 'optiscaler-schema-sync-issue.md'
          Set-Content -LiteralPath $bodyPath -Value $body -NoNewline -Encoding utf8
          $existing = gh issue list --repo $env:REPOSITORY --state open --search "$title in:title" --json number --jq '.[0].number'
          if ($existing) {
            gh issue comment $existing --repo $env:REPOSITORY --body-file $bodyPath
          } else {
            gh issue create --repo $env:REPOSITORY --title $title --body-file $bodyPath
          }
